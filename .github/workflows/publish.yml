name: Publish to Maven Central

# Manual trigger only. Real publishing is intentional and requires human
# approval — it is never run automatically on push/tag.
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: >
          Dry run: build + publish locally to ~/.m2 (validates the publication
          and its POM) WITHOUT uploading anything to Maven Central.
        required: true
        default: true
        type: boolean

jobs:
  publish:
    runs-on: ubuntu-latest

    # Credentials only flow into the environment as ORG_GRADLE_PROJECT_* Gradle
    # properties. Secrets are never echoed or written to disk.
    env:
      ORG_GRADLE_PROJECT_MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
      ORG_GRADLE_PROJECT_MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
      ORG_GRADLE_PROJECT_GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
      ORG_GRADLE_PROJECT_GPG_KEY_PASSWORD: ${{ secrets.GPG_KEY_PASSWORD }}
      ORG_GRADLE_PROJECT_GPG_KEY_ID: ${{ secrets.GPG_KEY_ID }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: ./gradlew build

      - name: Validate publication into local Maven repo (dry run)
        if: inputs.dry_run == true
        run: ./gradlew publishToMavenLocal

      - name: Publish to Maven Central (Central Portal)
        if: inputs.dry_run == false
        run: ./gradlew publishToSonatype closeAndReleaseSonatypeStagingRepository