# Gradle daemon memory + parallel builds
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.parallel=true

# Publish credentials come from environment / CI secrets as ORG_GRADLE_PROJECT_*
# properties (MAVEN_CENTRAL_USERNAME, MAVEN_CENTRAL_PASSWORD, GPG_PRIVATE_KEY,
# GPG_KEY_PASSWORD, GPG_KEY_ID). They are intentionally NOT committed here.